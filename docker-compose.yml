services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: pesaflow_v2
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3329:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pesaflow_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql://root:@db:3306/pesaflow_v2
      - PORT=2365
    depends_on:
      - db
    ports:
      - "2365:2365"
    networks:
      - pesaflow_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked at build time into the Next.js bundle
        # For local: http://localhost:2365/api
        # For production: https://mpesaconnect.co.ke/api
        NEXT_PUBLIC_API_URL: http://localhost:2365/api
    restart: always
    environment:
      - PORT=3652
    depends_on:
      - backend
    ports:
      - "3652:5054"
    networks:
      - pesaflow_net

networks:
  pesaflow_net:
    driver: bridge

volumes:
  mysql_data:

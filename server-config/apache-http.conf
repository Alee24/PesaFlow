# Apache HTTP Configuration (Port 80)
# File: /etc/apache2/sites-available/mpesaconnect.co.ke.conf

<VirtualHost *:80>
    ServerName mpesaconnect.co.ke
    ServerAlias www.mpesaconnect.co.ke
    
    # Redirect all HTTP to HTTPS
    Redirect permanent / https://mpesaconnect.co.ke/

    # Uploads directory
    Alias /uploads /var/www/mpesaconnect.co.ke/backend/public/uploads
    <Directory /var/www/mpesaconnect.co.ke/backend/public/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Proxy configuration (backup if HTTPS fails)
    ProxyPreserveHost On
    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/
</VirtualHost>

# Apache HTTPS/SSL Configuration (Port 443)
# File: /etc/apache2/sites-available/mpesaconnect.co.ke-le-ssl.conf

<VirtualHost *:443>
    ServerName mpesaconnect.co.ke
    ServerAlias www.mpesaconnect.co.ke

    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy /api requests to Backend (port 3002)
    ProxyPass /api http://localhost:3002/api
    ProxyPassReverse /api http://localhost:3002/api
    
    # Proxy everything else to Frontend (port 3001)
    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/

    # Uploads directory
    Alias /uploads /var/www/mpesaconnect.co.ke/backend/public/uploads
    <Directory /var/www/mpesaconnect.co.ke/backend/public/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mpesaconnect_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/mpesaconnect_ssl_access.log combined

    # SSL Configuration (managed by Certbot)
    SSLCertificateFile /etc/letsencrypt/live/mpesaconnect.co.ke/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mpesaconnect.co.ke/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
